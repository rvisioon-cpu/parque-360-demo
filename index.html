<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>RVISIOON · Parque 360 — Demo</title><link rel="stylesheet" href="style.css"></head>
<body><main id="tour" aria-label="Recorrido virtual del parque"><div id="viewer"></div><div id="hotspots"></div>
<header class="top"><div class="brand"><img src="logo.png" alt="RVISIOON"><span>PARQUE / RECORRIDO 360°</span></div><div class="tools"><div class="lighting" aria-label="Iluminación"><button id="day" aria-pressed="true">☀ Día</button><button id="night" aria-pressed="false">☾ Noche</button></div><button id="fullscreen" aria-label="Pantalla completa">⛶</button><button id="vr" title="Usar un visor compatible">Modo VR</button></div></header>
<div id="loading" role="status"><span class="spinner"></span><span id="loading-text">Preparando el parque…</span></div><div id="notice" role="status" hidden></div>
<footer class="bottom"><div class="place"><span id="point">01 / 18</span><h1 id="place-name">Acceso noreste</h1><p>Arrastra para mirar · Toca los círculos para avanzar</p></div><div class="bottom-actions"><button id="reset" aria-label="Mirar hacia el parque">Centrar vista ↺</button><button id="map-toggle" aria-expanded="false" aria-controls="map-panel">Mapa del parque ↗</button></div></footer>
<aside id="map-panel" hidden><div class="map-heading"><div><span>EXPLORA A TU RITMO</span><h2>Un parque, 18 miradas.</h2></div><button id="map-close" aria-label="Cerrar mapa">×</button></div><div id="map" aria-label="Mapa de puntos del recorrido"></div><p class="map-note">Selecciona un punto para ir allí. Los círculos en el paseo conectan los puntos cercanos.</p><div id="nearby"></div></aside>
<div id="error" hidden><h2>No pudimos abrir el recorrido.</h2><p id="error-text"></p><button onclick="location.reload()">Volver a intentar</button></div><output id="debug" hidden></output></main><script type="module" src="app.js"></script></body></html>
